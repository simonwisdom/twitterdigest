name: daily-digest

on:
  schedule:
    - cron: "0 11 * * *" # 11:00 UTC daily; digest window = previous 24h
  workflow_dispatch:
    inputs:
      date:
        description: "Digest date (YYYY-MM-DD), defaults to today"
        required: false
      force_from:
        description: "Re-run from stage (fetch|filter|cluster|summarize)"
        required: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ -n "${{ inputs.force_from }}" ]; then ARGS="$ARGS --force-from ${{ inputs.force_from }}"; fi
          npx tsx scripts/run-pipeline.ts $ARGS
