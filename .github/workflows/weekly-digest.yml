name: refresh-weekly-digest

on:
  schedule:
    - cron: "0 11 * * 1" # Mondays at 11:00 UTC
  workflow_dispatch:
    inputs:
      date:
        description: "Digest date (YYYY-MM-DD), defaults to today"
        required: false
      force_from:
        description: "Re-run from stage (fetch|filter|cluster|summarize)"
        required: false

permissions:
  contents: write

concurrency:
  group: weekly-digest-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate weekly digest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: google/gemini-3.7-flash
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          DIGEST_DATA_DIR: data
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ -n "${{ inputs.force_from }}" ]; then ARGS="$ARGS --force-from ${{ inputs.force_from }}"; fi
          npm run pipeline -- $ARGS
      - name: Persist digest and dedup history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/digests data/history
          if git diff --cached --quiet; then
            echo "No digest data changed"
          else
            git commit -m "Update weekly digest data"
            git push
          fi
